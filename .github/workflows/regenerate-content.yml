name: Regenerate content (updates + concepts + diagrams index)

on:
  push:
    branches: [main]
    # Evita loop: cuando el workflow commitea los JSON regenerados, ese push
    # toca solo estas paths, así no se re-dispara a sí mismo. También ignora
    # diagramas SVG nuevos (los indexa el siguiente push real).
    paths-ignore:
      - 'frontend/src/data/generated/**'
      - 'frontend/src/data/projects.ts'
  schedule:
    - cron: '0 6 * * 1'   # Lunes 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regenerate-content
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # necesario para que `git log -n 30` funcione
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: backend/package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install backend dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile

      - name: Generate updates
        working-directory: backend
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: pnpm script:updates

      - name: Generate concepts
        working-directory: backend
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: pnpm script:concepts

      - name: Sync diagrams index (sin LLM, solo file system)
        working-directory: backend
        run: pnpm script:diagrams

      - name: Commit regenerated content if changed
        run: |
          # Incluye generated/ (updates, concepts, diagrams.json) Y los SVGs
          # sanitizados in-place por sync-diagrams.
          changes=$(git status --porcelain frontend/src/data/generated/ frontend/public/diagrams/)
          if [[ -n "$changes" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add frontend/src/data/generated/ frontend/public/diagrams/
            git commit -m "chore(content): regenerate updates, concepts and diagrams index [skip ci]"
            # Race-safe: si otro workflow pusheó mientras tanto, rebase + retry.
            for i in 1 2 3 4 5; do
              git pull --rebase origin main || true
              if git push; then break; fi
              echo "Push intento $i falló, reintento en 5s..."
              sleep 5
              [ $i -eq 5 ] && exit 1
            done
          else
            echo "Sin cambios en generated/ ni en diagrams/"
          fi
