name: Deploy Cloudflare Workers

# Triggers activos desde Fase 5 (setup Cloudflare completo):
#   - cuenta Cloudflare + wrangler login OK
#   - KV namespace RATE_LIMIT creado (id pegado en wrangler.toml)
#   - GROQ_API_KEY como secret en el worker (vía wrangler secret put)
#   - GitHub Secrets: CLOUDFLARE_API_TOKEN + VITE_CHAT_API_URL listos
on:
  push:
    branches: [main]
    paths:
      - 'backend/workers/chat/**'
      - 'backend/scripts/sync-portfolio-context.ts'
      - 'frontend/src/data/projects.ts'
      - '.github/workflows/deploy-workers.yml'
  workflow_dispatch:

permissions:
  contents: write  # para poder commitear portfolio-context.generated.ts si cambió

concurrency:
  group: workers-deploy
  cancel-in-progress: false

jobs:
  deploy-chat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: backend/package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install backend dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile

      - name: Regenerate portfolio context
        working-directory: backend
        run: pnpm tsx scripts/sync-portfolio-context.ts

      - name: Commit regenerated context if it changed
        run: |
          if [[ -n "$(git status --porcelain backend/workers/chat/src/portfolio-context.generated.ts)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add backend/workers/chat/src/portfolio-context.generated.ts
            git commit -m "chore(backend): regenerate chat portfolio context [skip ci]"
            # Race-safe: si otro workflow pusheó mientras tanto, rebase + retry.
            for i in 1 2 3 4 5; do
              git pull --rebase origin main || true
              if git push; then break; fi
              echo "Push intento $i falló, reintento en 5s..."
              sleep 5
              [ $i -eq 5 ] && exit 1
            done
          else
            echo "portfolio-context.generated.ts unchanged"
          fi

      - name: Deploy chat worker
        # Corre desde `backend/` porque las deps de wrangler viven ahí
        # (NO en workers/chat/ que no tiene su propio package.json).
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler deploy --config workers/chat/wrangler.toml
